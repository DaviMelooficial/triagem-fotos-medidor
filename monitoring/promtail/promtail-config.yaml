# Promtail: lê logs/inferencia.jsonl (montado em /var/log/triagem) e envia cada linha ao Loki.
# A linha vai inteira (JSON); viram rótulo só campos com poucos valores (evento, status, backend).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /posicoes/posicoes.yaml # lembra até onde leu, para não reenviar depois de reiniciar

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: triagem
    static_configs:
      - targets: [localhost]
        labels:
          job: triagem-medidor
          __path__: /var/log/triagem/inferencia.jsonl
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            evento: evento
            status: status
            backend: backend
      - labels:
          evento:
          status:
          backend:
      - timestamp: # a hora da linha é a do log (ISO 8601 com microssegundos), não a da leitura
          source: ts
          format: RFC3339Nano
