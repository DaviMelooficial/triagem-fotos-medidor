# Pilha de monitoramento (extras do enunciado). O serviço BentoML roda FORA do Docker, no host
# (just serve), e estes containers olham para ele:
#   Prometheus  coleta o /metrics a cada 5 s e guarda o histórico no próprio banco (TSDB, volume)
#   Loki        guarda as linhas do logs/inferencia.jsonl, enviadas pelo Promtail
#   Grafana     opcional, já com Prometheus e Loki como fontes de dados (http://localhost:3030)
# Subir:  docker compose -f monitoring/docker-compose.yml up -d     (ou: just pilha)
# Porta do serviço diferente de 3000:  PORTA_API=3001 docker compose -f monitoring/docker-compose.yml up -d
name: triagem-monitoramento

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    # O prometheus.yml não aceita variável de ambiente; trocamos a porta do alvo antes de subir.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s/PORTA_API/$${PORTA_API:-3000}/" /etc/prometheus/prometheus.yml.modelo > /tmp/prometheus.yml &&
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=15d
        --storage.tsdb.retention.size=1GB
        --web.enable-lifecycle
    environment:
      PORTA_API: ${PORTA_API:-3000}
    volumes:
      - ./prometheus/prometheus.yml.modelo:/etc/prometheus/prometheus.yml.modelo:ro
      - ./prometheus/regras.yml:/etc/prometheus/regras.yml:ro
      - prometheus-dados:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # no Linux; no Mac/Windows já existe

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-dados:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ../logs:/var/log/triagem:ro # a mesma pasta em que o serviço escreve
      - promtail-posicoes:/posicoes
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-dados:
  loki-dados:
  promtail-posicoes:
